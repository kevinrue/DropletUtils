# BiocJobs job specification.
# This file, together with scripts/read-10x-counts-mtx.R, is all
# a package maintainer adds to make this analysis dispatchable.
biocjobs: "1.0"
name: read-10x-counts-mtx
package: DropletUtils
title: Read 10X Counts (MTX)
tagline: import single-cell counts from Matrix Market file format
description: >
  Creates a SingleCellExperiment from the CellRanger Matrix Market
  file format files for 10X Genomics data, saved in H5AD format.
version: "1.0.0"
license: MIT
script: scripts/read-10x-counts-mtx.R
depends: [anndataR]

container: ghcr.io/kevinrue/dropletutils:devel

inputs:
  - name: mtx_file
    required: true
    format: txt
    label: Raw count matrix
    help: >
      Matrix of integer UMI counts in Matrix Market File format (.mtx.gz).
  - name: barcodes_file
    required: true
    format: tsv
    label: Cell barcodes
    help: >
      Single-column tab-separated file (.tsv.gz) containing the barcode sequences
      represented by columns of the count matrix, with one barcode per line.
  - name: features_file
    required: true
    format: tsv
    label: Feature annotations
    help: >
      Tab-separated file (.tsv.gz) describing the features represented by rows of the
      count matrix. Contains the feature ID, feature name, and feature type,
      such as Gene Expression.

outputs:
  - name: outfile
    format: h5
    label: H5AD file
    help: >
      H5AD file exported from the SingleCellExperiment object using anndataR.

options:
  - name: sample_name
    type: string
    required: true
    label: Sample name
    help: >
      Sample name stored in the cell metadata.
      Particularly useful to track the sample of origin for each cell
      after merging multiple datasets.

resources:
  cpus: 1
  memory_gb: 4
  disk_gb: 10

citations:
  - doi: 10.18129/B9.bioc.DropletUtils   # Bioconductor landing page

tests:
  - inputs:
      mtx_file: test-data/matrix.mtx.gz
      barcodes_file: test-data/barcodes.tsv.gz
      features_file: test-data/features.tsv.gz
    options:
      sample_name: my_sample
    outputs:
      outfile:
        file: test-data/sce.h5ad
        compare: sim_size
        delta: 3000
