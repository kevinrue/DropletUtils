# BiocJobs job specification.
# This file, together with scripts/read-10x-counts.R, is all
# a package maintainer adds to make this analysis dispatchable.
biocjobs: "1.0"
name: read-10x-counts
package: DropletUtils
title: Read 10X Counts
tagline: import single-cell counts from 10X files
description: >
  Creates a SingleCellExperiment from the CellRanger output files for
  10X Genomics data.
version: "1.0.0"
license: MIT
script: scripts/read-10x-counts.R
depends: [LoomExperiment]

inputs:
  - name: mtx_file
    format: mtx
    label: Raw count matrix
    help: >
      Matrix of integer UMI counts in Matrix Market File Format.
  - name: barcodes_file
    format: tsv
    label: Cell barcodes
    help: >
      Single-column tab-separated file containing the barcode sequences
      represented by columns of the count matrix, with one barcode per line.
  - name: genes_files
    format: tsv
    label: Feature annotations
    help: >
      Tab-separated file describing the features represented by rows of the
      count matrix. Contains the feature ID, feature name, and feature type,
      such as Gene Expression.
      

outputs:
  - name: outfile
    format: loom
    label: Loom file
    help: >
      Loom file exported from a SingleCellLoomExperiment object.

# params <- list(
#     sample_name = "sample_name",
# )
options:
  - name: sample_name
    type: string
    required: true
    label: Sample name
    help: >
      Sample name stored in the cell metadata.
      Particularly useful to track the sample of origin for each cell
      after merging multiple datasets.

resources:
  cpus: 1
  memory_gb: 4
  disk_gb: 10

citations:
  - doi: 10.18129/B9.bioc.DropletUtils   # Bioconductor landing page

tests:
  - inputs:
      mtx_file: test-data/matrix.mtx
      barcodes_file: test-data/barcodes.tsv
      genes_files: test-data/genes.tsv
    options:
      sample_name: "sample_name"
    outputs:
      outfile:
        file: test-data/scle.loom
        compare: sim_size
        delta: 3000
